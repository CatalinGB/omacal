[package]
name = "omacal-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The Tauri-free HTTP skin over `omacal-view`: it serves the Svelte build and
# answers the app's boot commands over HTTP. It must never depend on
# `src-tauri`, or Tauri/WebKitGTK come along and the container is impossible.

[lib]
name = "omacal_server"
path = "src/lib.rs"

[[bin]]
name = "omacal-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
omacal-view = { version = "0.1.0", path = "../omacal-view" }
omacal-store = { version = "0.1.0", path = "../omacal-store" }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing-subscriber = "0.3.23"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
